<svg viewBox="0 0 760 780" width="760" height="780" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Haibin — skills card</title>
  <desc>Animated profile card: pronouns, bio, code, expertise, omics focus, Shiny apps, a fun fact, and bar charts for working hours and multi-omics focus.</desc>
  <rect x="8" y="8" width="744" height="784" fill="#ffffff" stroke="#e3e6ea" stroke-width="1"/>
  <g font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.6s" fill="freeze"/>
    <text x="32" y="48" font-size="27" font-weight="500" fill="#1b1f28">I'm Haibin</text>
    <rect x="188" y="30" width="86" height="23" rx="11.5" fill="#e9f4ec"/>
    <text x="231" y="46" font-size="12.5" fill="#3f8a52" text-anchor="middle">she / her</text>
    <text x="32" y="90" font-size="14" font-style="italic" fill="#57606a">I'm a Computational Biologist working at the <tspan fill="#4a9a5f" font-style="normal">PRIME</tspan> Lab at Icahn School of Medicine at Mount Sinai in NYC.</text>
    <line x1="32" y1="110" x2="728" y2="110" stroke="#e8eaee" stroke-width="1"/>
    <text x="32" y="138" font-size="11" letter-spacing="1.6" fill="#6e7781">CODE</text>
    <g font-size="13.5">
      <rect x="32" y="148" width="34" height="26" rx="14" fill="#f0f2f5"/>
      <text x="49.0" y="166" text-anchor="middle" fill="#24292f">R</text>
      <rect x="74" y="148" width="56" height="26" rx="14" fill="#f0f2f5"/>
      <text x="102.0" y="166" text-anchor="middle" fill="#24292f">HTML</text>
      <rect x="138" y="148" width="50" height="26" rx="14" fill="#f0f2f5"/>
      <text x="163.0" y="166" text-anchor="middle" fill="#24292f">CSS</text>
      <rect x="196" y="148" width="66" height="26" rx="14" fill="#f0f2f5"/>
      <text x="229.0" y="166" text-anchor="middle" fill="#24292f">Python</text>
      <rect x="270" y="148" width="72" height="26" rx="14" fill="#f0f2f5"/>
      <text x="306.0" y="166" text-anchor="middle" fill="#24292f">MATLAB</text>
    </g>
    <text x="32" y="198" font-size="11" letter-spacing="1.6" fill="#6e7781">ASK ME ABOUT</text>
    <g font-size="13.5">
      <rect x="32" y="208" width="206" height="26" rx="14" fill="#f0f2f5"/>
      <text x="135.0" y="226" text-anchor="middle" fill="#24292f">Multi-Omics Data Analysis</text>
      <rect x="246" y="208" width="152" height="26" rx="14" fill="#f0f2f5"/>
      <text x="322.0" y="226" text-anchor="middle" fill="#24292f">Data Visualization</text>
      <rect x="406" y="208" width="106" height="26" rx="14" fill="#f0f2f5"/>
      <text x="459.0" y="226" text-anchor="middle" fill="#24292f">3D Modeling</text>
      <rect x="520" y="208" width="146" height="26" rx="14" fill="#f0f2f5"/>
      <text x="593.0" y="226" text-anchor="middle" fill="#24292f">Shiny App Design</text>
    </g>
    <text x="32" y="260" font-size="11" letter-spacing="1.6" fill="#6e7781">OMICS DATA</text>
    <circle cx="612" cy="256" r="4" fill="#4a9a5f"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/><animate attributeName="r" values="4;5;4" dur="1.9s" repeatCount="indefinite"/></circle>
    <text x="624" y="260" font-size="11" fill="#6e7781">current focus</text>
    <g font-size="13.5">
      <rect x="32" y="270" width="120" height="26" rx="14" fill="#4a9a5f"><animate attributeName="fill" values="#4a9a5f;#59ac6e;#4a9a5f" dur="2.8s" begin="1.6s" repeatCount="indefinite"/></rect>
      <text x="92.0" y="288" text-anchor="middle" fill="#ffffff" font-weight="500">Metabolomics</text>
      <rect x="160" y="270" width="102" height="26" rx="14" fill="#f0f2f5"/>
      <text x="211.0" y="288" text-anchor="middle" fill="#24292f">Proteomics</text>
      <rect x="270" y="270" width="110" height="26" rx="14" fill="#4a9a5f"><animate attributeName="fill" values="#4a9a5f;#59ac6e;#4a9a5f" dur="2.8s" begin="1.6s" repeatCount="indefinite"/></rect>
      <text x="325.0" y="288" text-anchor="middle" fill="#ffffff" font-weight="500">Exposomics</text>
      <rect x="388" y="270" width="140" height="26" rx="14" fill="#f0f2f5"/>
      <text x="458.0" y="288" text-anchor="middle" fill="#24292f">Transcriptomics</text>
    </g>
    <text x="32" y="322" font-size="11" letter-spacing="1.6" fill="#6e7781">SHINY APPS</text>
    <g font-size="13.5">
      <rect x="32" y="332" width="176" height="26" rx="14" fill="#f0f2f5"/>
      <text x="120.0" y="350" text-anchor="middle" fill="#24292f">WorklistsGenerator</text>
      <rect x="216" y="332" width="98" height="26" rx="14" fill="#f0f2f5"/>
      <text x="265.0" y="350" text-anchor="middle" fill="#24292f">BatCheck</text>
    </g>
    <text x="32" y="384" font-size="11" letter-spacing="1.6" fill="#6e7781">FUN FACT</text>
    <rect x="32" y="392" width="696" height="60" rx="10" fill="#f5f7f9"/>
    <rect x="32" y="392" width="4" height="60" fill="#b0a598"/>
    <text x="52" y="418" font-size="13.5" font-style="italic" font-family="Georgia, Times New Roman, serif" fill="#3a4048">Tiny molecules make a big difference. Genomics tells you what you might have,</text>
    <text x="52" y="438" font-size="13.5" font-style="italic" font-family="Georgia, Times New Roman, serif" fill="#3a4048">while metabolomics tells you what you do have.</text>
    <text x="32" y="476" font-size="12.5" fill="#768390">Weakness — multitasking</text>
    <line x1="32" y1="498" x2="728" y2="498" stroke="#e8eaee" stroke-width="1"/>
    <text x="32" y="526" font-size="14" font-weight="500" fill="#1b1f28">I love working in the early morning</text>
    <g font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13">
      <text x="32" y="552" fill="#57606a">6:00 – 11:00 AM</text>
      <rect x="200" y="539" width="480" height="14" rx="9" fill="#eef0f3" stroke="#dfe2e7" stroke-width="1"/>
      <rect x="200" y="539" width="0" height="14" rx="9" fill="#4a9a5f"><animate attributeName="width" from="0" to="336" begin="0.40s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.75 0.25 1"/></rect>
      <text x="720" y="552" text-anchor="end" fill="#24292f">70%</text>
      <text x="32" y="578" fill="#57606a">12:00 – 16:00 PM</text>
      <rect x="200" y="565" width="480" height="14" rx="9" fill="#eef0f3" stroke="#dfe2e7" stroke-width="1"/>
      <rect x="200" y="565" width="0" height="14" rx="9" fill="#4a9a5f"><animate attributeName="width" from="0" to="96" begin="0.52s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.75 0.25 1"/></rect>
      <text x="720" y="578" text-anchor="end" fill="#24292f">20%</text>
      <text x="32" y="604" fill="#57606a">16:00 – 21:00 PM</text>
      <rect x="200" y="591" width="480" height="14" rx="9" fill="#eef0f3" stroke="#dfe2e7" stroke-width="1"/>
      <rect x="200" y="591" width="0" height="14" rx="9" fill="#4a9a5f"><animate attributeName="width" from="0" to="48" begin="0.64s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.75 0.25 1"/></rect>
      <text x="720" y="604" text-anchor="end" fill="#24292f">10%</text>
    </g>
    <text x="32" y="638" font-size="14" font-weight="500" fill="#1b1f28">Multi-omics current focus</text>
    <g font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13">
      <text x="32" y="664" fill="#57606a">Genomics</text>
      <rect x="200" y="651" width="480" height="14" rx="9" fill="#eef0f3" stroke="#dfe2e7" stroke-width="1"/>
      <rect x="200" y="651" width="0" height="14" rx="9" fill="#4a9a5f"><animate attributeName="width" from="0" to="24" begin="0.72s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.75 0.25 1"/></rect>
      <text x="720" y="664" text-anchor="end" fill="#24292f">5%</text>
      <text x="32" y="690" fill="#57606a">Transcriptomics</text>
      <rect x="200" y="677" width="480" height="14" rx="9" fill="#eef0f3" stroke="#dfe2e7" stroke-width="1"/>
      <rect x="200" y="677" width="0" height="14" rx="9" fill="#4a9a5f"><animate attributeName="width" from="0" to="24" begin="0.84s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.75 0.25 1"/></rect>
      <text x="720" y="690" text-anchor="end" fill="#24292f">5%</text>
      <text x="32" y="716" fill="#57606a">Proteomics</text>
      <rect x="200" y="703" width="480" height="14" rx="9" fill="#eef0f3" stroke="#dfe2e7" stroke-width="1"/>
      <rect x="200" y="703" width="0" height="14" rx="9" fill="#4a9a5f"><animate attributeName="width" from="0" to="24" begin="0.96s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.75 0.25 1"/></rect>
      <text x="720" y="716" text-anchor="end" fill="#24292f">5%</text>
      <text x="32" y="742" fill="#57606a">Metabolomics</text>
      <rect x="200" y="729" width="480" height="14" rx="9" fill="#eef0f3" stroke="#dfe2e7" stroke-width="1"/>
      <rect x="200" y="729" width="0" height="14" rx="9" fill="#4a9a5f"><animate attributeName="width" from="0" to="240" begin="1.08s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.75 0.25 1"/></rect>
      <text x="720" y="742" text-anchor="end" fill="#24292f">50%</text>
      <text x="32" y="768" fill="#57606a">Exposomics</text>
      <rect x="200" y="755" width="480" height="14" rx="9" fill="#eef0f3" stroke="#dfe2e7" stroke-width="1"/>
      <rect x="200" y="755" width="0" height="14" rx="9" fill="#4a9a5f"><animate attributeName="width" from="0" to="168" begin="1.20s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.75 0.25 1"/></rect>
      <text x="720" y="768" text-anchor="end" fill="#24292f">35%</text>
    </g>
  </g>
</svg>
